[tool.poetry]
name = "manual-test-coverage"
version = "0.1.0"
description = "Native Frida-based manual code coverage recording for manual test runs"
authors = ["Roland Würsching"]
license = "Apache-2.0"
packages = [
    { include = "manual_test_coverage", from = "src"},
]
include = [
    "src/manual_test_coverage/agents/*.js",
    "src/manual_test_coverage/*.ui",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
frida = "*"
frida-tools = "*"
# Qt 6.10 supports macOS versions before 14.4.
PySide6-Essentials = "~6.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pylint = "^4.0.5"
pyinstaller = "^6.20.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
